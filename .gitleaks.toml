# Extends the default rules, it does not replace them.
#
# gitleaks finds this by itself: it looks for .gitleaks.toml in the directory being scanned,
# and the secrets job scans the repo root. No --config flag, and no workflow change.
title = "agon"

[extend]
useDefault = true

# Two on-chain address fields whose names end in "Key", which the default generic-api-key rule reads
# as a secret because the value is long and high entropy:
#
#   ammKey      the AMM pool a Jupiter route plan goes through.
#   accountKey  an account in an RPC transaction response. 24 of these blocked T-A01, the decoder,
#               which is the existential F1 path.
#
# Three more from the Helius enhanced transactions response, which names token accounts rather than
# owners. 885 of these blocked T-C09, the first path that runs end to end:
#
#   tokenAccount, fromTokenAccount, toTokenAccount
#
# An associated token account address is derived from the owner and the mint and is public. It is
# not a credential and there is nothing to rotate.
#
# Both are public on-chain data. Stripping either would gut the recording the benchmark replays.
#
# This forgives the matched text and nothing else. It deliberately does NOT use `paths`: a path
# allowlist exempts the whole file, and a real key planted in a Jupiter fixture then passes the
# scan, which was verified before this was written this way. Scoped to the match, a secret under
# any other name still fails, including in the same file.
[allowlist]
regexTarget = "match"
regexes = [
  '''(ammKey|accountKey|tokenAccount|fromTokenAccount|toTokenAccount)"\s*:\s*"[1-9A-HJ-NP-Za-km-z]{32,44}"''',
]
