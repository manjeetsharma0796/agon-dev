name: board

# Enforces the TASKS.md protocol: the claim lock, then PR hygiene.
# Every check returns one line, because the next reader is usually an agent paying per token.

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Read-only. Nothing writes to dev except a merged pull request, so no job here needs write access.
permissions:
  contents: read
  pull-requests: read

jobs:
  lock:
    # A direct push to dev is the claim. It may move Status lines and nothing else.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did this commit arrive through a pull request?
        # A squash-merge is also a push to dev carrying code, and that is the one legitimate way
        # code lands here. Only a direct push is a claim, and only a claim is restricted.
        id: origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)
          echo "from_pr=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Claim push, Status lines only
        if: steps.origin.outputs.from_pr == 'false'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/board.mjs claim-push

      - name: The board still lints after a merge
        if: steps.origin.outputs.from_pr == 'true'
        run: node scripts/board.mjs lint

      - name: The board still lints after a claim
        run: node scripts/board.mjs lint

  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Board lint, branch, body and diff
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/board.mjs pr

      - name: FEASIBILITY.md is current
        # FEASIBILITY.md only. This job runs against the MERGE commit, so anything derived from
        # TASKS.md is computed from merged task statuses while the file was committed from the
        # branch: every PR went stale the moment anyone else's claim landed, which is constantly.
        # FEASIBILITY.md is derived from spikes/*/result.json, and those change only in the PR that
        # owns the spike.
        run: |
          set -euo pipefail
          node scripts/feasibility.mjs
          git diff --quiet FEASIBILITY.md || {
            echo "::error::FEASIBILITY.md is stale. Run 'node scripts/feasibility.mjs' and commit the result."
            git --no-pager diff --stat FEASIBILITY.md
            exit 1
          }

      - name: A frozen contract changed, so both sides must agree
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The three frozen contracts are four files, not the whole package. Keyed on the package, this
        # fired on T-E10 for adding a new messages module and then demanded a fixture change that
        # nothing had invalidated. A gate that cries wolf teaches everyone to tick the box without
        # reading, which is worse than no gate.
        run: |
          set -euo pipefail
          CONTRACTS="packages/core/src/check-trade.ts packages/core/src/report.ts packages/core/src/rule.ts packages/core/src/primitives.ts"
          if git diff --name-only "$BASE".."$HEAD" -- $CONTRACTS | grep -q .; then
            echo "$PR_BODY" | grep -q 'Changes a frozen contract in .packages/core.' \
              || { echo "::error::This PR changes one of the frozen contracts. Tick the frozen-contract box, name the reviewer, and change the fixtures in the same commit."; exit 1; }
            git diff --name-only "$BASE".."$HEAD" -- fixtures/ | grep -q . \
              || { echo "::error::A frozen contract changed but no fixture changed with it. A shape change must fail loudly wherever it breaks."; exit 1; }
          fi

      - name: Signing code needs a security review
        # The PRD asks a human to read anything that builds a transaction or a Swig instruction. It
        # does not ask them to read an empty stub, so the path alone is not the trigger: a scaffold
        # PR that creates packages/chain/src/index.ts holding `export {}` needs no security review,
        # and firing on it teaches people to tick the box without reading. The trigger is a path that
        # is unambiguously key material, or an added line that actually signs or moves value.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          why=""
          if git diff --name-only "$BASE".."$HEAD" | grep -Eq 'daemon|keychain|keypair'; then
            why="a path naming the daemon, the keychain or a keypair"
          elif git diff "$BASE".."$HEAD" -- 'packages/chain/**' 'packages/cli/**' \
               | grep -E '^\+' | grep -vE '^\+\s*(//|\*|/\*)' \
               | grep -Eq '(Keypair|secretKey|signTransaction|sendTransaction|partialSign|sendRawTransaction|Swig|tokenRecurringLimit|manageAuthority|durableNonce)'; then
            why="an added line that signs, or that builds a Swig role or instruction"
          fi
          if [ -n "$why" ]; then
            echo "$PR_BODY" | grep -q 'security-review. was also run' \
              || { echo "::error::This diff contains $why. Run /security-review, tick that box, and name a second reviewer who did not write the code."; exit 1; }
          fi
