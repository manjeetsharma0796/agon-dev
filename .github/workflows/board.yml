name: board

# Enforces the TASKS.md protocol: the claim lock, then PR hygiene.
# Every check returns one line, because the next reader is usually an agent paying per token.

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Read-only. Nothing writes to dev except a merged pull request, so no job here needs write access.
permissions:
  contents: read
  pull-requests: read

jobs:
  lock:
    # A direct push to dev is the claim. It may move Status lines and nothing else.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did this commit arrive through a pull request?
        # A squash-merge is also a push to dev carrying code, and that is the one legitimate way
        # code lands here. Only a direct push is a claim, and only a claim is restricted.
        id: origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)
          echo "from_pr=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Claim push, Status lines only
        if: steps.origin.outputs.from_pr == 'false'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/board.mjs claim-push

      - name: The board still lints after a merge
        if: steps.origin.outputs.from_pr == 'true'
        run: node scripts/board.mjs lint

      - name: The board still lints after a claim
        run: node scripts/board.mjs lint

  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Board lint, branch, body and diff
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/board.mjs pr

      - name: Generated files are current
        # No bot commits to dev, so the author regenerates these in their own PR. Otherwise the
        # README summary and FEASIBILITY.md drift away from the board and stop being worth reading.
        run: |
          set -euo pipefail
          node scripts/board.mjs summary
          node scripts/feasibility.mjs
          git diff --quiet README.md FEASIBILITY.md || {
            echo "::error::README.md or FEASIBILITY.md is stale. Run 'node scripts/board.mjs summary && node scripts/feasibility.mjs' and commit the result."
            git --no-pager diff --stat README.md FEASIBILITY.md
            exit 1
          }

      - name: A frozen contract changed, so both sides must agree
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE".."$HEAD" -- packages/core | grep -q .; then
            echo "$PR_BODY" | grep -q 'Changes a frozen contract in .packages/core.' \
              || { echo "::error::This PR touches packages/core. Tick the frozen-contract box, name the reviewer, and change the fixtures in the same commit."; exit 1; }
            git diff --name-only "$BASE".."$HEAD" -- fixtures/ | grep -q . \
              || { echo "::error::packages/core changed but no fixture changed with it. A shape change must fail loudly wherever it breaks."; exit 1; }
          fi

      - name: Signing code needs a security review
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE".."$HEAD" | grep -Eq '^packages/(chain|cli)/|daemon|keychain'; then
            echo "$PR_BODY" | grep -q 'security-review. was also run' \
              || { echo "::error::This diff touches chain, the daemon or keys. Run /security-review, tick the box, and name a second reviewer who did not write it."; exit 1; }
          fi
